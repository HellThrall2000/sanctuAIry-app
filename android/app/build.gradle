plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.sanctuary"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Required by flutter_local_notifications 22.x, which uses java.time on
        // a minSdk of 24. Without it the build fails outright with
        // "Dependency ':flutter_local_notifications' requires core library
        // desugaring to be enabled".
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.sanctuary"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    // Backports java.time for minSdk 24 — see coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // flutter_litert_lm 0.3.0 pins litertlm-android:0.10.0, built from upstream
    // 2026-04-11 — that runtime predates Gemma 4 and aborts inside
    // nativeCreateEngine on a model whose LlmMetadata declares
    // `llm_model_type { gemma4 }`. Gradle resolves to the highest version, so
    // naming a newer one here upgrades the runtime the plugin loads.
    //
    // Pinned to 0.13.1, NOT latest: 0.14.0 changed `Backend.CPU`'s constructor
    // from (Integer) to (Integer, Integer), and the plugin's precompiled Kotlin
    // calls the old one — it dies with NoSuchMethodError in parseBackend().
    // 0.13.1 is the newest release that keeps the signature the plugin expects.
    // Verify with javap before bumping this; drop the override once the plugin
    // updates its own pin.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.13.1'

    // NOTE: com.google.mediapipe:tasks-genai was removed. No Android source
    // referenced it (only ios/Runner/AppDelegate.swift, which this build does
    // not touch), it resolved via the non-reproducible `latest.release`, and it
    // ships native libraries that overlap liblitertlm_jni.so.
}

name: sanctuary
description: A beautiful, privacy-first sanctuary featuring a private writing companion, passcode-secured diary lockbox, and custom loopable ambient soundscapes.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  just_audio: ^0.9.36
  crypto: ^3.0.3
  uuid: ^4.3.3
  # Vendored fork of pub.dev flutter_litert_lm 0.3.0. Upstream never forwards
  # the native SamplerConfig `seed` field, so every conversation sampled from
  # seed 0 and the companion returned byte-identical replies. See
  # packages/flutter_litert_lm/VENDOR.md for the full diff and how to rebase.
  flutter_litert_lm:
    path: packages/flutter_litert_lm
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_analytics: ^12.4.5
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Ambient loops for "Environment Resonance".
  #
  # Listed file by file rather than as `assets/audio/`, deliberately: a
  # directory entry bundles whatever happens to be in the folder, so a stray
  # source WAV or an editor's backup would silently add tens of megabytes to
  # every install. It also keeps ATTRIBUTIONS.md out of the APK.
  #
  # Adding a loop is two lines: one here, and `bundled: true` in Soundscape —
  # see lib/services/soundscape_controller.dart. Record its licence in
  # assets/audio/ATTRIBUTIONS.md at the same time.
  assets:
    - assets/audio/Glass_and_Petrichor.mp3

  # Organic design system (see "Sanctuary design variations/"). Both families
  # are SIL Open Font License; the licence texts ship in assets/fonts/.
  #
  # Figtree is only published upstream as a variable font. The three weights
  # here are static instances cut from `Figtree[wght].ttf` with
  # `fontTools.varLib.instancer`, because Flutter's mapping of `fontWeight`
  # onto a variable font's `wght` axis varies by version — static instances
  # render the same everywhere.
  fonts:
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Regular.ttf
          weight: 400
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700

